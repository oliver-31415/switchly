stages:
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

default:
  before_script:
    - chmod +x ./gradlew
  cache:
    key: gradle
    paths:
      - .gradle/
      - .gradle/wrapper/
      - .gradle/caches/

build_release_apk:
  stage: build
  script:
    - ./gradlew :app:assembleRelease
  artifacts:
    name: "switchly-release-$CI_COMMIT_SHORT_SHA"
    expire_in: 90 days
    paths:
      - app/build/outputs/apk/release/*.apk
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'