workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: gradle
  paths:
    - .gradle/
    - .gradle/wrapper/
    - .gradle/caches/

.android_build:
  image: eclipse-temurin:17-jdk-jammy
  stage: build

  variables:
    ANDROID_SDK_ROOT: /sdk

  before_script:
    - apt-get update
    - apt-get install -y wget unzip
    - mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - cd $ANDROID_SDK_ROOT/cmdline-tools
    - wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
    - unzip -q tools.zip
    - rm -rf latest
    - mv cmdline-tools latest
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    - yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses > /dev/null || true
    - sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-36" "build-tools;36.0.0"
    - cd $CI_PROJECT_DIR
    - chmod +x ./gradlew

build_public_offline_release:
  extends: .android_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  script:
    - ./gradlew --no-daemon :app:public-release-apk

  artifacts:
    name: "switchly-public-offline-$CI_COMMIT_SHORT_SHA"
    when: on_success
    expire_in: 30 days
    paths:
      - dist/Switchly-*-offline-unsigned.apk
      - dist/Switchly-*-offline.apk

# This job appears only when the maintainer configured all private release inputs as protected CI variables. 
# Forks and the public repository still build successfully through build_public_offline_release without any secrets.
validate_official_release_variants:
  extends: .android_build
  rules:
    - if: '$GOOGLE_SERVICES_JSON_B64 && $SWITCHLY_RELEASE_KEYSTORE_B64 && $SWITCHLY_RELEASE_STORE_PASSWORD && $SWITCHLY_RELEASE_KEY_ALIAS && $SWITCHLY_RELEASE_KEY_PASSWORD'

  script:
    - printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
    - printf '%s' "$SWITCHLY_RELEASE_KEYSTORE_B64" | base64 -d > switchly-release.jks
    - >-
      ./gradlew --no-daemon :app:release-apk
      -PSWITCHLY_RELEASE_STORE_FILE=switchly-release.jks
      -PSWITCHLY_RELEASE_STORE_PASSWORD="$SWITCHLY_RELEASE_STORE_PASSWORD"
      -PSWITCHLY_RELEASE_KEY_ALIAS="$SWITCHLY_RELEASE_KEY_ALIAS"
      -PSWITCHLY_RELEASE_KEY_PASSWORD="$SWITCHLY_RELEASE_KEY_PASSWORD"

  artifacts:
    name: "switchly-official-release-$CI_COMMIT_SHORT_SHA"
    when: on_success
    expire_in: 30 days
    paths:
      - dist/Switchly-*.apk
      - dist/Switchly-*.aab
