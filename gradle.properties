# Gradle JVM settings for this project.
# -Xmx2048m gives Gradle up to 2 GB heap memory.
# -Dfile.encoding=UTF-8 keeps file encoding consistent across builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries instead of the old support libraries.
android.useAndroidX=true

# Use Kotlin's official code style defaults.
kotlin.code.style=official
